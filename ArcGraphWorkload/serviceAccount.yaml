# Carried over unchanged from post 035. The workload in this post reuses the same
# service account, so the same federated credential keeps working.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kv-reader
  namespace: workload-identity
  annotations:
    azure.workload.identity/client-id: "<client id of the user-assigned managed identity>"
    azure.workload.identity/tenant-id: "<your tenant id>"
