# Generated by New-ArcWorkloadIdentityLab.ps1. Kept here as a reference.
# Replace the vault name with your own.
#
# Three things matter in this manifest:
#   - serviceAccountName points at the annotated service account
#   - the azure.workload.identity/use label tells the mutating webhook to inject the
#     projected token and the Azure environment variables
#   - Disable-AzContextAutosave stops the Az modules writing the client assertion out to
#     the container filesystem
apiVersion: v1
kind: Pod
metadata:
  name: workload-identity-test
  namespace: workload-identity
  labels:
    azure.workload.identity/use: "true"
spec:
  serviceAccountName: kv-reader
  containers:
    - name: powershell
      image: mcr.microsoft.com/azure-powershell:latest
      command: ["pwsh", "-Command"]
      args:
        - |
          Disable-AzContextAutosave -Scope Process | Out-Null
          $federatedToken = Get-Content -Path $env:AZURE_FEDERATED_TOKEN_FILE -Raw
          Connect-AzAccount -ServicePrincipal -ApplicationId $env:AZURE_CLIENT_ID -Tenant $env:AZURE_TENANT_ID -FederatedToken $federatedToken | Out-Null
          $secret = Get-AzKeyVaultSecret -VaultName kvlocalarc10005 -Name LocalClusterSecret -AsPlainText
          Write-Output $secret
          Start-Sleep -Seconds 3600
  nodeSelector:
    kubernetes.io/os: linux
